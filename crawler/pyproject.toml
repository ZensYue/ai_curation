[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kp-crawler"
version = "0.1.0"
description = "KP feasibility crawler HTTP service"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "zensyue", email = "zensyue@163.com" }
]
dependencies = []

[project.scripts]
kp-crawler = "kp_crawler.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
